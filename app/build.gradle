plugins {
    id 'com.android.application'
}

android {
    sourceSets {
        main.assets.srcDir "$buildDir/generated/shaders"
    }

    namespace 'com.p5s.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.p5s.android'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    // Preserve extracted native libraries for NativeActivity/dlopen while keeping
    // the packaging policy in Gradle instead of the deprecated manifest attribute.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
