name: P5S shared runtime integration

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/p5s/game.cpp'
      - 'scripts/patch_p5s_runtime.py'
      - 'scripts/verify_p5s_adaptations.py'
      - 'scripts/verify_runtime_apk.sh'
      - 'app/src/main/java/com/p5s/android/MainActivity.java'
      - 'app/src/main/cpp/native-lib.cpp'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'app/src/main/shaders/**'
      - 'runtime-adapter/**'
      - '.github/workflows/runtime-integration.yml'

permissions:
  contents: read

jobs:
  android-arm64-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_REPO: https://github.com/Brandon04Gonzalez/p5r-android.git
      UPSTREAM_COMMIT: baf036bbf6a842db6a41426a609bc22c8c826494
      VULKAN_SDK: ${{ github.workspace }}/vulkan-sdk
    steps:
      - name: Checkout P5S adapter
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android toolchain
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK
        run: sdkmanager 'platform-tools' 'ndk;28.2.13676358'

      - name: Set up .NET 10 for the ARM64 shader translator
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify native build tools
        run: |
          for tool in cmake ninja git curl tar patch; do
            command -v "$tool" || { echo "Missing required tool: $tool"; exit 1; }
          done

      - name: Fetch pinned shared runtime
        run: |
          git clone --filter=blob:none "$UPSTREAM_REPO" runtime-src
          git -C runtime-src checkout --detach "$UPSTREAM_COMMIT"
          mkdir -p runtime-src/games/p5s
          cp games/p5s/game.cpp runtime-src/games/p5s/game.cpp
          test -f runtime-src/runtime/include/nx/game.h
          grep -q 'namespace nx::game' runtime-src/games/p5s/game.cpp
          python3 scripts/patch_p5s_runtime.py runtime-src

      - name: Audit P5S-specific runtime adaptations
        run: python3 scripts/verify_p5s_adaptations.py runtime-src

      - name: Run upstream Android MediaImage2 plane-layout unit tests
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror \
            -Iruntime-src/runtime/src \
            runtime-src/tests/media_image_test.cpp \
            -o /tmp/p5s-media-image-test
          /tmp/p5s-media-image-test

      - name: Prepare Vulkan headers and Android dependencies
        run: |
          mkdir -p private/third_party
          git init private/third_party/Vulkan-Headers-1.4.357
          git -C private/third_party/Vulkan-Headers-1.4.357 remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C private/third_party/Vulkan-Headers-1.4.357 fetch --depth 1 origin e3b1eec08173d6b825cd3ac88c885a63b621504a
          git -C private/third_party/Vulkan-Headers-1.4.357 checkout --detach FETCH_HEAD
          mkdir -p "$VULKAN_SDK"
          ln -s "$GITHUB_WORKSPACE/private/third_party/Vulkan-Headers-1.4.357/include" "$VULKAN_SDK/Include"
          mkdir -p private/third_party/ryubing
          curl --fail --location --show-error --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 -o private/third_party/ryubing.tar.gz https://codeberg.org/Software_arch/Ryubing/archive/a82350bb77.tar.gz
          tar -xzf private/third_party/ryubing.tar.gz -C private/third_party/ryubing --strip-components=1
          rm private/third_party/ryubing.tar.gz
          mkdir -p runtime-src/private/third_party
          cp -a private/third_party/ryubing runtime-src/private/third_party/ryubing

      - name: Configure shared runtime for P5S (ARM64 NCE)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK="$SDK/ndk/28.2.13676358"
          cmake -S runtime-src -B build-p5s-runtime -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DNX_GAME=p5s \
            -DNX_NCE=ON

      - name: Compile shared runtime and P5S adapter
        run: cmake --build build-p5s-runtime --target p5s --parallel 2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ARM64 Maxwell-to-SPIR-V translator
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          dotnet publish runtime-src/tools/maxwell/spirv_harness/SpirvHarness.csproj \
            -c Release -r linux-bionic-arm64 \
            -p:NxBuildDir=spirv_harness_android \
            -p:PublishAot=true -p:NativeLib=Shared -p:OutputType=Library \
            -p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true \
            -p:CppCompilerAndLinker="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" \
            -p:ObjCopyName="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy" \
            -p:StripSymbols=true -o "$GITHUB_WORKSPACE/build-p5s-harness/publish"
          cp build-p5s-harness/publish/spirv_harness.so build-p5s-harness/libspirvharness.so

      - name: Package native runtime and build APK
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-p5s-runtime/libp5s.so app/src/main/jniLibs/arm64-v8a/libp5s.so
          cp build-p5s-harness/libspirvharness.so app/src/main/jniLibs/arm64-v8a/libspirvharness.so
          if ! command -v glslangValidator >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq glslang-tools
          fi
          mkdir -p app/build/generated/shaders
          glslangValidator -V app/src/main/shaders/triangle.vert -o app/build/generated/shaders/triangle.vert.spv
          glslangValidator -V app/src/main/shaders/triangle.frag -o app/build/generated/shaders/triangle.frag.spv
          gradle --no-daemon assembleDebug

      - name: Verify APK runtime libraries and native entry points
        run: bash scripts/verify_runtime_apk.sh

      - name: Publish P5S Android APK
        uses: actions/upload-artifact@v4
        with:
          name: P5S-Android-runtime-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish runtime integration library
        uses: actions/upload-artifact@v4
        with:
          name: p5s-runtime-arm64-integration-test
          path: build-p5s-runtime/libp5s.so
          if-no-files-found: error
